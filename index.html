<style>
:root{--cb:#fffaf0;--ct:#0f172a;box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:radial-gradient(ellipse at top,#1e293b 0%,#0a0e1a 60%)}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:#e2e8f0;height:100vh;width:100vw;overflow:hidden}

#stage{
  position:relative;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2vh 2vw;
  box-sizing:border-box;
}

#titulo{
  position:absolute;
  top:1.5vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  cursor:pointer;
  z-index:30;
  padding:1vh 2vw;
  border-radius:16px;
  transition:background .25s, box-shadow .25s;
  max-width:94vw;
}
#titulo:hover,
#titulo:focus-visible{
  background:rgba(255,255,255,.06);
  box-shadow:0 0 0 2px rgba(255,255,255,.15);
  outline:none;
}
#titulo h1{
  margin:0;
  font-size:clamp(16px,1.9vw,24px);
  font-weight:700;
  color:#fff;
  letter-spacing:.4px;
  line-height:1.15;
}
#titulo p{
  margin:5px 0 0;
  font-size:clamp(11px,1.05vw,13px);
  color:#94a3b8;
  letter-spacing:1px;
}
#titulo .pistaClic{
  display:inline-block;
  margin-top:4px;
  font-size:clamp(10px,.95vw,12px);
  color:#c084fc;
  letter-spacing:1px;
  animation:latido 2s ease-in-out infinite;
}
@keyframes latido{0%,100%{opacity:.6}50%{opacity:1}}

.escenaWrap{
  position:relative;
  width:min(96vw,1100px);
  height:100%;
  max-height:88vh;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:4vh;
}

.escena{
  height:100%;width:100%;
  display:block;
  position:relative;
  z-index:1;
  overflow:visible;
}
.escena .pantalla{fill:#0a0e1a;stroke:#475569;stroke-width:3}
.escena .pantallaGlow{fill:url(#gp);opacity:.25;animation:flicker 2.5s infinite}
.escena .codigo{stroke:#22c55e;stroke-width:2.5;stroke-linecap:round;opacity:.85}
.escena .cabeza{fill:#e0b48c}
.escena .pelo{fill:#3b2a1a}
.escena .cuerpo{fill:#334155;stroke:#475569;stroke-width:2}
.escena .mano{fill:#e0b48c}
.escena .silla{fill:#1e293b;stroke:#475569;stroke-width:2}
.escena .base{fill:#1e293b;stroke:#475569;stroke-width:3}
.escena .balanza{stroke:#fbbf24;stroke-width:2.5;fill:none;stroke-linecap:round}
@keyframes flicker{0%,100%{opacity:.15}50%{opacity:.45}}

.zonaTxt{
  font-family:'Fredoka','Trebuchet MS',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:1.5px;
}

.grupoPunto{cursor:pointer;transition:transform .25s}
.grupoPunto:hover,
.grupoPunto:focus-visible{outline:none}
.grupoPunto:hover .halo,
.grupoPunto:focus-visible .halo{opacity:.55;transform:scale(1.15)}
.grupoPunto:hover .circulo,
.grupoPunto:focus-visible .circulo{transform:scale(1.15)}
.grupoPunto .circulo{transition:transform .25s;transform-origin:center;transform-box:fill-box}
.grupoPunto .halo{opacity:.3;transition:opacity .25s, transform .25s;transform-origin:center;transform-box:fill-box;animation:haloPulso 2.4s ease-in-out infinite}
@keyframes haloPulso{0%,100%{opacity:.25}50%{opacity:.5}}

.grupoPunto .iconoSVG{
  font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  font-size:16px;
  pointer-events:none;
  text-anchor:middle;
  dominant-baseline:central;
  fill:#fff;
}

#card{
  position:fixed;z-index:50;left:0;top:0;
  width:min(540px,calc(100vw - 24px));
  background:var(--cb);color:var(--ct);
  border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.6);
  padding-bottom:18px;
  font-size:19px;line-height:1.45;
  opacity:0;transform:translateY(8px) scale(.97);
  pointer-events:none;transition:opacity .18s,transform .18s;
  max-height:82vh;
  overflow-y:auto;
}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card img{display:block;width:100%;height:140px;object-fit:cover;background:#0f172a}
#card .tag{display:inline-block;margin:12px 22px 0;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:1px}
#card .tag.r{background:#f3e8ff;color:#6b21a8}
#card .tag.p{background:#dcfce7;color:#166534}
#card .tag.t{background:#e0f2fe;color:#075985}
#card h3{margin:8px 22px 4px;font-size:23px;line-height:1.15;font-weight:700}
#card .intro{margin:0 22px 8px;font-weight:600;font-size:17px;color:#475569}
#card .texto{margin:8px 22px 0;font-weight:500;font-size:17px;color:#1e293b}
#card .ejemplo{
  margin:16px 22px 0;
  padding:12px 14px;
  border-radius:8px;
  font-size:15px;
  font-weight:500;
  background:#f1f5f9;
  border-left:4px solid #64748b;
}
#card .ejemplo strong{color:#334155}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $=id=>document.getElementById(id);

/* ============================================================
   CONTENIDO: 5 problemas ↔ 5 buenas prácticas
   Texto directo, sin etiquetas internas
   ============================================================ */
const INFO={

titulo:{
  tag:'t',
  t:'¿Qué es la ética en IA?',
  d:'Es el conjunto de principios morales, normas y directrices que guían el diseño, desarrollo, entrenamiento, implementación y uso de los sistemas de IA para garantizar que beneficien a la sociedad y respeten los derechos humanos.'
},

/* --- 5 PROBLEMAS --- */
r1:{
  tag:'r',
  t:'La IA aprende de un mundo injusto',
  intro:'Si los ejemplos con los que se entrena ya eran injustos, la IA repite esa injusticia.',
  texto:'La IA aprende mirando muchos ejemplos del pasado: quién consiguió un trabajo, quién recibió un préstamo, quién fue detenido. Si en el pasado ya había trato desigual hacia mujeres, personas de ciertos barrios o ciertos apellidos, la IA lo aprende como si fuera "lo normal" y lo aplica a todos por igual.',
  ejemplo:'Una empresa usó IA para elegir currículums y el sistema descartaba a las mujeres, porque había aprendido de años en los que casi solo se contrataba a hombres.'
},
r2:{
  tag:'r',
  t:'No se sabe por qué la IA decidió eso',
  intro:'La IA acierta o falla, pero no explica el motivo.',
  texto:'Muchas IA modernas toman decisiones usando millones de cálculos internos que ni quien las programó puede seguir paso a paso. Eso significa que cuando la IA niega un préstamo, rechaza a un paciente o descarta a un candidato, nadie puede decir con claridad qué dato fue el que pesó más.',
  ejemplo:'Un banco rechazó un préstamo con IA y no pudo explicarle al cliente por qué, ni pudo justificarlo ante un juez.'
},
r3:{
  tag:'r',
  t:'Los datos de las personas quedan expuestos',
  intro:'Para aprender, la IA necesita mucha información personal.',
  texto:'Para funcionar bien, la IA suele necesitar millones de datos: caras, voces, historiales médicos, ubicaciones, conversaciones. Si esos datos no se cuidan, pueden filtrarse, venderse a terceros o usarse para vigilar a la gente sin que lo sepa.',
  ejemplo:'Fotos subidas a redes sociales fueron usadas para entrenar sistemas de reconocimiento facial sin pedir permiso a sus dueños.'
},
r4:{
  tag:'r',
  t:'La IA también contamina',
  intro:'Entrenar una IA grande consume mucha electricidad.',
  texto:'Entrenar una IA muy grande puede necesitar miles de ordenadores encendidos durante semanas. Eso consume mucha electricidad y genera emisiones contaminantes. No se ve en las demostraciones, pero el coste ambiental es real.',
  ejemplo:'Entrenar un solo modelo grande de lenguaje puede contaminar lo mismo que varios coches funcionando durante toda su vida útil.'
},
r5:{
  tag:'r',
  t:'Nadie responde cuando la IA se equivoca',
  intro:'Si algo sale mal, no está claro a quién reclamar.',
  texto:'Cuando una IA toma una mala decisión, es difícil saber de quién es la culpa: de quien programó, de la empresa que la puso en marcha, de quien la usó o del propio sistema. Esa falta de responsables deja a las personas afectadas sin poder reclamar.',
  ejemplo:'Un coche con piloto automático provocó un accidente y el fabricante, el proveedor de los sensores y el autor del programa se echaron la culpa unos a otros.'
},

/* --- 5 BUENAS PRÁCTICAS --- */
p1:{
  tag:'p',
  t:'Revisar los ejemplos antes de entrenar',
  intro:'Un buen programador comprueba si los datos son justos.',
  texto:'Antes de entrenar la IA, hay que revisar de dónde vienen los ejemplos y comprobar si representan a todos por igual: hombres y mujeres, distintos barrios, distintas edades. Si un grupo sale mal parado, se corrigen los ejemplos o se descarta el entrenamiento.',
  ejemplo:'Separar los ejemplos por grupos (por ejemplo, hombres y mujeres) y comprobar que la IA acierta igual con todos antes de publicarla.'
},
p2:{
  tag:'p',
  t:'Poder explicar lo que la IA decide',
  intro:'Si la IA decide sobre personas, hay que poder justificarlo.',
  texto:'Un buen programador deja por escrito qué datos usa la IA, cómo los usa y con qué criterios decide. Y si la IA es tan compleja que no se puede explicar, usa herramientas que al menos señalen qué dato pesó más en cada caso concreto.',
  ejemplo:'Cuando la IA rechaza a alguien, poder mostrarle una explicación clara y comprensible de por qué se tomó esa decisión.'
},
p3:{
  tag:'p',
  t:'Cuidar los datos de las personas',
  intro:'Lo que no se guarda, no se puede filtrar.',
  texto:'Un buen programador solo recoge los datos que de verdad hacen falta, los guarda cifrados, borra lo que ya no se necesita y nunca los comparte sin permiso. La privacidad se piensa desde el principio, no se arregla después.',
  ejemplo:'No guardar nombres ni teléfonos si no son imprescindibles, y borrar automáticamente los datos antiguos.'
},
p4:{
  tag:'p',
  t:'Pensar también en el planeta',
  intro:'Ahorrar energía también es ser ético.',
  texto:'Un buen programador mide cuánta electricidad consume su IA, elige opciones más eficientes cuando el resultado es el mismo y prefiere servidores que usen energía limpia. Si una IA pequeña hace lo mismo que una gigante, se usa la pequeña.',
  ejemplo:'Usar modelos más pequeños cuando rinden igual, y anotar cuánta energía y cuánta contaminación genera cada entrenamiento.'
},
p5:{
  tag:'p',
  t:'Firmar y responder por lo que se publica',
  intro:'Cada versión de la IA debe tener un responsable claro.',
  texto:'Un buen programador no publica una IA de forma anónima. Deja claro quién la hizo, qué versión es, qué se sabe de sus fallos y a quién puede reclamar una persona afectada si algo sale mal.',
  ejemplo:'Cada IA en funcionamiento tiene un nombre, un responsable y un canal de contacto para que cualquiera pueda preguntar o reclamar.'
}

 const k=el.dataset.k;const o=INFO[k];if(!o)return;
 const src=PHOTO[k];const alt=ALT[k]||o.t;

 let tag='';
 if(o.tag==='r')tag='<span class="tag r">⚠ LO QUE PUEDE SALIR MAL</span>';
 else if(o.tag==='p')tag='<span class="tag p">✓ LO QUE HACE UN BUEN PROGRAMADOR</span>';
 else if(o.tag==='t')tag='<span class="tag t">DEFINICIÓN</span>';

 let body='';
 if(o.tag==='t'){
   body=`<p class="texto">${o.d}</p>`;
 } else {
   body=`
     ${o.intro?`<div class="intro">${o.intro}</div>`:''}
     <p class="texto">${o.texto}</p>
     <div class="ejemplo"><strong>${o.tag==='r'?'Ejemplo:':'Cómo se aplica:'}</strong> ${o.ejemplo}</div>
   `;
 }

 card.innerHTML=`
   <img src="${src}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"/>
   ${tag}
   <h3>${o.t}</h3>
   ${body}
 `;

 const rc=el.getBoundingClientRect(),cw=card.offsetWidth,ch=card.offsetHeight;
 const x=Math.max(8,Math.min(innerWidth-cw-8,rc.left+rc.width/2-cw/2));
 const up=rc.top-ch-6;
 const y=up>=8?up:(rc.bottom+6+ch<=innerHeight-8?rc.bottom+6:Math.max(8,innerHeight-ch-8));
 card.style.left=x+'px';card.style.top=y+'px';card.classList.add('on');
}
function hideAll(){card.classList.remove('on')}

document.addEventListener('mouseover',e=>{
 clearTimeout(timer);
 if(card.contains(e.target))return;
 const el=e.target.closest('[data-k]');
 if(el)show(el);
 else timer=setTimeout(hideAll,380);
});

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-k]');
 if(el){
   clearTimeout(timer);
   show(el);
   timer=setTimeout(hideAll,6000);
 } else if(!card.contains(e.target)){
   hideAll();
 }
});

document.addEventListener('focusin',e=>{
 const el=e.target.closest('[data-k]');
 if(el)show(el);
});

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')hideAll();
});
</script>

</body>
</html>
